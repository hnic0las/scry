# cargo-mutants (README, "Test quality"). The FFI layer is tested from
# Swift, which cargo-mutants cannot run, so its mutants would all survive.
exclude_globs = ["crates/scry-ffi/**"]
# Every package's tests, not only the mutated one's: the core is also
# tested through the FFI and the CLI.
test_workspace = true
# Without debug info each mutant links faster (cargo-mutants' advice).
profile = "mutants"
# The tests take about 20 s alone and longer with several mutants at once:
# a shorter limit timed out unmutated behaviour and counted the mutant as
# caught. Run through scripts/mutants.sh, which kills a test that fills
# memory, so a long limit costs time, not the machine.
minimum_test_timeout = 120
