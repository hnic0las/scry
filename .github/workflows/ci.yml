name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    # The core must stay portable (vault decision 0003, rule 4).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  app:
    # The macOS app: the Swift bindings generated from the core, then the
    # app built and its view models tested, in Debug as developers run it
    # and in Release as it will ship. The image matches the project's
    # Xcode (27), which provides the macOS 26 and later APIs the app uses.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      # Xcode lists the sources before its own build phase writes the
      # bindings, so a fresh checkout generates them first (README).
      - run: scripts/build-ffi.sh
      - run: >
          xcodebuild test
          -project apps/macos/Scry.xcodeproj -scheme Scry
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
      - run: CONFIGURATION=Release scripts/build-ffi.sh
      - run: >
          xcodebuild build
          -project apps/macos/Scry.xcodeproj -scheme Scry -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
