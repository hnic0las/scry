[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# Not published until the licence and the distribution model are decided.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The Debug app links the debug core: without optimising the dependencies
# (tree-sitter and its grammars, in C), opening a large file is five times
# slower than in release. Scry's own crates stay unoptimised for debugging.
[profile.dev.package."*"]
opt-level = 3
