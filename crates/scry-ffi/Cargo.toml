[package]
name = "scry-ffi"
description = "The Scry core exposed to Swift through UniFFI, for the macOS app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "scry_ffi"
# staticlib: linked into the macOS app. cdylib: read by uniffi-bindgen to
# generate the Swift bindings. lib: for Rust tests.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

# Not the workspace lints: UniFFI generates the unsafe code that crosses the
# boundary to Swift, so `unsafe_code` cannot be forbidden here. This crate
# only converts types; all logic stays in scry-core.
[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
scry-core = { version = "0.2.0", path = "../scry-core" }
uniffi = { version = "0.32", features = ["cli"] }

[dev-dependencies]
tempfile = "3.27.0"
